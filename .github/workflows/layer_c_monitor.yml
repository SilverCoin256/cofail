name: Layer C monitor

# The longitudinal evidence engine. Runs independently of any one contributor's machine or any
# one chat session: it re-checks the open-model archive for models added since the last run,
# harvests the delta in per-benchmark, size-capped, individually-committed steps (see the
# 2026-08-03 postmortem inline below), recomputes the calibrated residual-concentration
# statistics, and commits one dated row to results/timeseries.csv plus one CHANGELOG.md entry.
# This is what keeps producing evidence after the paper is published, without a second research
# program.
#
# Manual runs (workflow_dispatch) are for on-demand refreshes; the schedule is the actual
# "living statistic" mechanism. See docs/LAYER_C.md for what this can and cannot show, including
# the large-backlog gradual-catchup behaviour introduced after the first scheduled run failed,
# the 2026-08-07 postmortem on push-race handling below, and the 2026-08-08 note on MM_WORKERS=3
# (dropped from 6 as a hedge after two back-to-back runs were externally cancelled ~1-2 minutes
# into ARC harvest, cause unconfirmed -- see docs/LAYER_C.md).

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of each month -- an off-tick time, not :00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: layer-c-monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's hard cap for hosted runners is 360; leave a small margin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # [figures] too, not just [harvest]: the 2026-08-09 run harvested all five benchmarks and
        # ran the monitor successfully, then died on `import matplotlib` in the figure step --
        # which, because the commit step ran after it, discarded five freshly computed timeseries
        # rows and the CHANGELOG entry along with it.
        run: pip install -e ".[harvest,figures]"

      - name: Configure git identity for incremental commits
        run: |
          git config user.name "layer-c-bot"
          git config user.email "actions@users.noreply.github.com"
          # 2026-08-07 postmortem: a 30-minute ARC harvest step (800 new models, 0 rejects,
          # fully successful) was lost in its entirety because `git push` was rejected --
          # main had moved (an unrelated same-day commit landed on main while this job was
          # mid-flight) and the step had no retry logic, so the job failed and the runner
          # tore down with the harvested delta committed only locally. This function wraps
          # every push in this workflow: on rejection, fetch + rebase onto the new tip and
          # retry. Safe here because each step's own changes touch only its own paths
          # (substrate/<bench>.npz, or results/+figures/+CHANGELOG.md in the final step),
          # so a concurrent push touching other files rebases cleanly with no real conflict.
          cat > /tmp/push_with_retry.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i/5), fetching and rebasing onto the new tip"
            git fetch origin main
            git rebase origin/main
          done
          echo "push still rejected after 5 attempts" >&2
          exit 1
          EOF
          chmod +x /tmp/push_with_retry.sh

      - name: Refresh model list (discover new models since last run)
        run: MM_REFRESH_MODELS=1 python src/harvest_manifest.py
        env:
          MM_WORKERS: "3"

      # Harvest and commit ONE BENCHMARK AT A TIME, not all five then commit once at the end.
      #
      # 2026-08-03 postmortem: the archive had grown from ~1,362 to 7,038 candidate models
      # since the original harvest -- ~5,600 newly discovered in one run. At the throughput
      # realized under GitHub Actions' rate limits (~0.3 models/s, far below this project's
      # interactive-session throughput), that backlog does not fit in a single run at any
      # timeout GitHub allows. The run was cancelled 2,300 models into ARC alone, and because
      # the old workflow committed only once at the very end, all of that harvested progress
      # was lost rather than merely delayed -- despite src/harvest_matrix.py itself already
      # checkpointing to local disk every 100 models, that local checkpoint never reached git
      # before the runner was torn down.
      #
      # MM_MAX_NEW bounds a single benchmark's per-run harvest so it reliably finishes inside
      # its share of the job's time budget; a large backlog then drains gradually across
      # several scheduled runs. Each benchmark is committed immediately after its own harvest
      # step, so a timeout on a later benchmark can no longer erase progress on an earlier one.
      # Push goes through /tmp/push_with_retry.sh (see 2026-08-07 postmortem above) so a
      # same-day push to main from elsewhere can no longer erase a completed harvest either.
      - name: Harvest and commit ARC
        run: |
          python src/harvest_matrix.py arc
          git add substrate/
          git diff --cached --quiet && echo "arc: nothing new" || git commit -m "Layer C: ARC harvest delta $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
        env:
          MM_WORKERS: "3"
          MM_MAX_NEW: "800"

      - name: Harvest and commit Winogrande
        run: |
          python src/harvest_matrix.py winogrande
          git add substrate/
          git diff --cached --quiet && echo "winogrande: nothing new" || git commit -m "Layer C: Winogrande harvest delta $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
        env:
          MM_WORKERS: "3"
          MM_MAX_NEW: "800"

      - name: Harvest and commit TruthfulQA
        run: |
          python src/harvest_matrix.py truthfulqa
          git add substrate/
          git diff --cached --quiet && echo "truthfulqa: nothing new" || git commit -m "Layer C: TruthfulQA harvest delta $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
        env:
          MM_WORKERS: "3"
          MM_MAX_NEW: "800"

      - name: Harvest and commit GSM8K
        run: |
          python src/harvest_matrix.py gsm8k
          git add substrate/
          git diff --cached --quiet && echo "gsm8k: nothing new" || git commit -m "Layer C: GSM8K harvest delta $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
        env:
          MM_WORKERS: "3"
          MM_MAX_NEW: "800"

      - name: Harvest and commit HellaSwag
        run: |
          python src/harvest_matrix.py hellaswag
          git add substrate/
          git diff --cached --quiet && echo "hellaswag: nothing new" || git commit -m "Layer C: HellaSwag harvest delta $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
        env:
          MM_WORKERS: "3"
          MM_MAX_NEW: "800"

      - name: Run the monitor (recompute calibrated statistics, append timeseries + changelog)
        run: python src/monitor.py arc winogrande truthfulqa gsm8k hellaswag

      # Commit the monitor's output BEFORE regenerating figures, and regenerate figures in a step
      # that cannot fail the job. 2026-08-09 postmortem: the monitor completed and emitted five
      # timeseries rows plus a CHANGELOG entry, then `python src/figures.py` raised
      # ModuleNotFoundError, the commit step was skipped as a consequence, and all of that
      # computed output was torn down with the runner. This is the same failure shape as the
      # 2026-08-03 and 2026-08-07 incidents: real, finished work destroyed by a later, unrelated
      # step. The ordering below makes the cheap, regenerable artifact (a PDF) the only thing at
      # risk, never the measurement.
      - name: Commit timeseries and changelog
        run: |
          git add results/ CHANGELOG.md
          git diff --cached --quiet && echo "nothing new this cycle" || git commit -m "Layer C monthly refresh: $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh

      - name: Regenerate the cohort figure
        continue-on-error: true
        run: python src/figures.py

      - name: Commit the regenerated figure
        continue-on-error: true
        run: |
          git add figures/
          git diff --cached --quiet && echo "figures unchanged" && exit 0
          git commit -m "Layer C: regenerate cohort figure $(date -u +%Y-%m-%d)"
          /tmp/push_with_retry.sh
