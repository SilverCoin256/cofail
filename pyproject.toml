[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cofail"
version = "0.1.0"
description = "Identified estimation of correlated failure between models, over a margin-preserving null"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
harvest = ["pyarrow>=14", "huggingface_hub>=0.23", "pandas>=2.0"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
cofail = "cofail.cli:main"

[tool.setuptools]
packages = ["cofail"]
