<circle cx="215.3" cy="34.0" r="3" fill="#2a78d6"/>
<circle cx="307.3" cy="34.0" r="3" fill="#2a78d6"/>
<circle cx="430.0" cy="34.0" r="3" fill="#2a78d6"/>
<text x="442.0" y="38.0" font-size="10" fill="#2a78d6" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >shared failure modes</text>
<polyline points="62.0,232.0 98.8,103.3 135.6,34.0 209.2,34.0 319.6,34.0 430.0,34.0" fill="none" stroke="#eb6834" stroke-width="2.4"/>
