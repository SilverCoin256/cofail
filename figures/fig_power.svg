<line x1="62" y1="133.0" x2="430" y2="133.0" stroke="#c9c8c0" stroke-width="0.6"/>
<text x="54.0" y="136.5" font-size="9" fill="#52514e" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >0.50</text>
<line x1="62" y1="83.5" x2="430" y2="83.5" stroke="#c9c8c0" stroke-width="0.6"/>
<text x="54.0" y="87.0" font-size="9" fill="#52514e" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >0.75</text>
<line x1="62" y1="34.0" x2="430" y2="34.0" stroke="#c9c8c0" stroke-width="0.6"/>
<text x="54.0" y="37.5" font-size="9" fill="#52514e" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >1.00</text>
<text x="16.0" y="133.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" transform="rotate(-90 16 133.0)">power</text>
<polyline points="62.0,232.0 108.0,212.2 154.0,202.3 215.3,34.0 307.3,34.0 430.0,34.0" fill="none" stroke="#2a78d6" stroke-width="2.4"/>
<circle cx="62.0" cy="232.0" r="3" fill="#2a78d6"/>
<circle cx="108.0" cy="212.2" r="3" fill="#2a78d6"/>
