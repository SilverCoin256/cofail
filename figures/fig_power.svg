<circle cx="98.8" cy="103.3" r="3" fill="#eb6834"/>
<circle cx="135.6" cy="34.0" r="3" fill="#eb6834"/>
<circle cx="209.2" cy="34.0" r="3" fill="#eb6834"/>
<circle cx="319.6" cy="34.0" r="3" fill="#eb6834"/>
<circle cx="430.0" cy="34.0" r="3" fill="#eb6834"/>
<text x="442.0" y="54.0" font-size="10" fill="#eb6834" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >copying a reference model</text>
<line x1="62" y1="222.1" x2="430" y2="222.1" stroke="#1baf7a" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="442.0" y="225.6" font-size="10" fill="#1baf7a" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >shared item difficulty only</text>
<text x="442.0" y="238.1" font-size="9" fill="#52514e" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >power = 0.05 = α</text>
<line x1="62" y1="232" x2="430" y2="232" stroke="#0b0b0b" stroke-width="1"/>
<text x="246.0" y="256.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >planted strength (rescaled per alternative)</text>
<text x="62.0" y="272.0" font-size="9" fill="#52514e" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >none</text>
<text x="430.0" y="272.0" font-size="9" fill="#52514e" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >strong</text>
<text x="62.0" y="294.0" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Full power is reached at a planted rms of 0.048 — far below the 0.099–0.294 observed on real data.</text>
<text x="62.0" y="308.0" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >The flat line is not a weak result: that alternative is the null, so the test has no power against it by construction.</text>
</svg>
